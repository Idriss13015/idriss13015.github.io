    var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.pikacheck.app&utm_source=website&utm_medium=download_page&utm_campaign=deeplink';
    var DEEPLINK_URL = 'https://app.pikacheck.com/download'; // lien du QR code

    function getPlatform() {
      var ua = navigator.userAgent || '';
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
      if (/Android/.test(ua)) return 'android';
      return 'desktop';
    }
    function trackEvent(platform) {
      if (typeof gtag === 'function') gtag('event', 'deeplink_redirect', { event_category: 'download', event_label: platform });
      if (window.dataLayer) window.dataLayer.push({ event: 'deeplink_redirect', platform: platform });
    }

    var platform = getPlatform();
    trackEvent(platform);
    if (platform === 'ios' || platform === 'android') {
      document.getElementById('redirecting').hidden = false;
      setTimeout(function () { window.location.href = platform === 'ios' ? IOS_URL : ANDROID_URL; }, 300);
    } else {
      document.getElementById('desktopSection').hidden = false;
      new QRCode(document.getElementById('qrcode'), {
        text: DEEPLINK_URL, width: 180, height: 180,
        colorDark: '#1e2431', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
      });
    }
  </script>
